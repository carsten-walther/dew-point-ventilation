################################################################################
#
# Project Settings
#
################################################################################

# Pinout: https://randomnerdtutorials.com/esp32-pinout-reference-gpios/
# Example Menu: https://www.ambientika.eu/cms/wp-content/uploads/Ambientika-Taupunktsteuerung.pdf

substitutions:

  project_name: dew-point-ventilation
  author_name: carsten-walther
  friendly_name: Taupunktlüftung
  comment: Taupunktlüftung zur Steuerung von Abluftventilatoren
  version: 2026.8.8
  area: Keller

  #
  # GPIOs
  #
  PIN_I2C_SDA: GPIO21
  PIN_I2C_SCL: GPIO22
  
  PIN_RELAIS: GPIO23

  PIN_ROTARY_ENCODER_CLK: GPIO25
  PIN_ROTARY_ENCODER_DT: GPIO26
  PIN_ROTARY_ENCODER_SW: GPIO27

  #
  # Relay protection
  #
  # Minimum time the fan must keep running before the dew point logic may stop
  # it, and minimum pause before it may start again. Protects the motor and the
  # relay contacts from short cycling when the difference sits on the threshold.
  # Safety paths (sensor fault, temperature limits, manual Off) ignore these and
  # switch off immediately - protection must never outrank safety.
  MIN_RUN_TIME_S: "300"
  MIN_PAUSE_TIME_S: "180"

################################################################################
#
# General Settings
#
################################################################################

#
# https://esphome.io/components/esphome
#
esphome:
  name: "${project_name}"
  friendly_name: "${friendly_name}"
  comment: "${comment}"
  area: "${area}"

  build_path: "../config/esphome/build/${project_name}"
  
  project:
    name: "${author_name}.${project_name}"
    version: "${version}"
    # never leave the fan energised across a firmware update
    on_update:
      then:
        - switch.turn_off: relais_id

  on_boot:
    # priority 800 runs after hardware init but before WiFi/network comes up
    - priority: 800
      then:
        # Light the display for backlight_delay seconds so the user sees the
        # device boot - same path every user interaction takes.
        - script.execute: backlight_wake_script
        # seed the system clock from the RTC; without network this is the only
        # source of time, and the display shows --:-- until it succeeds
        - ds1307.read_time:
        # Belt and braces. The relais already lands off on its own - no
        # restore_mode is configured, so it takes the schema default ALWAYS_OFF -
        # but the fan must never come up energised, and that is worth stating
        # rather than inheriting silently.
        - switch.turn_off: relais_id
        # Backdate the last-change stamp by a full pause, so the fan may start
        # on the first control_script tick instead of sitting out MIN_PAUSE.
        # Must come AFTER the turn_off above: if that one actually switches, its
        # on_turn_off handler overwrites this with millis().
        #
        # Why: fan_last_change_ms_id is restore_value: no and starts at 0, so
        # right after a boot "millis() - 0" is a few seconds and the pause guard
        # in control_script blocked every start for MIN_PAUSE_TIME_S. During the
        # watchdog-reset period that was most of the device's uptime.
        # The subtraction underflows on purpose - the guard does unsigned
        # arithmetic too, so the difference comes out correct either way.
        #
        # Trade-off, deliberate: after a watchdog reset the fan may restart
        # roughly a boot-time after it stopped, which is shorter than MIN_PAUSE.
        # A reboot is rare and the relay contacts survive it; a fan that never
        # runs does not do its job.
        - lambda: |-
            id(fan_last_change_ms_id) = millis() - (${MIN_PAUSE_TIME_S} * 1000UL);

    # Deliberately NOT 800: a restoring global is a component of its own with
    # setup_priority::HARDWARE, which is the same 800 this trigger would run at,
    # and equal priorities are resolved by registration order. Incrementing at
    # 800 would be a race against the load() that reads the stored value - it
    # could add 1 to the initial 0 and then have the restore overwrite it, so
    # the count would never grow. 700 is safely after every HARDWARE component
    # and still long before the network comes up. (The same trap is documented
    # on backlight_delay_id further down, where the number reads NaN at 800.)
    - priority: 700
      then:
        - lambda: |-
            id(reset_count_id) += 1;

  # priority 700 runs early enough that the relais is still controllable
  on_shutdown:
    priority: 700
    then:
      - switch.turn_off: relais_id

#
# https://esphome.io/components/esp32
#
esp32:
  board: esp32dev
  framework:
    # esp-idf, not arduino: with the arduino framework the libsodium stub that
    # arduino-esp32 pulls in shadows esphome/libsodium, which breaks the
    # noise-c build required by "api: encryption" (ESPHome 2026.7.x).
    # Consequence: no Arduino-only APIs (String, WiFi.*) in any lambda here.
    type: esp-idf
    advanced:
      # Both of these are suggested by ESPHome itself on every boot of this
      # device (app:171 and app:198). The chip reports rev 3.1, so the workaround
      # code for older silicon is dead weight, and this bootloader can map SRAM1
      # as IRAM. Only valid because this is a plain ESP32 - sram1_as_iram is
      # rejected on other variants.
      # Raising minimum_chip_revision means the image refuses to boot on a chip
      # older than 3.1. Fine here, but remember it if the board is ever swapped.
      minimum_chip_revision: "3.1"
      sram1_as_iram: True

#
# https://esphome.io/components/wifi
#
wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .local
  fast_connect: True
  power_save_mode: NONE
  enable_on_boot: True
  ap:
    ssid: "${project_name}"
    password: !secret wifi_ap_password

#
# https://esphome.io/components/captive_portal
#
captive_portal:

#
# https://esphome.io/components/ota
#
# One OTA path is configured: esphome is the classic push from
# the dashboard. It uses the handlers, which park the display on
# page 100 so the user sees progress on the LCD instead of a frozen screen.
#
ota:

  #
  # https://esphome.io/components/ota/esphome
  #
  - platform: esphome
    password: !secret ota_password
    on_state_change:
      then:
        - lambda: |-
            id(ota_state_id) = state;
            id(page_id) = 100;
        - component.update: display_id
    on_progress:
      then:
        - lambda: |-
            id(ota_progress_id) = x;
            id(display_id)->update();
            id(page_id) = 100;
    on_error:
      then:
        - switch.turn_off: relais_id
        - lambda: |-
            id(ota_state_id) = ota::OTA_ERROR;
            id(ota_error_id) = x;
            id(page_id) = 100;
        - component.update: display_id


#
# https://esphome.io/components/api
#
api:
  # Enable transport encryption of the API layer.
  encryption:
    # The pre-shared key for the encryption.
    key: !secret api_encryption_key
  # 0s disables the automatic reboot when Home Assistant is unreachable: this
  # device regulates on its own and must not restart just because HA is down
  reboot_timeout: 0s

#
# https://esphome.io/components/mqtt
#
mqtt:
  id: mqtt_client_id
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  # same reasoning as for the api above
  reboot_timeout: 0s
  # RESOLVED: the watchdog resets came from the broker and were fixed on the
  # server side. The history below is kept as the record of what was ruled out -
  # if the resets ever return, it says which knobs have already been tried.
  #
  # Off at boot stays the default anyway, by choice rather than by necessity.
  # Everything needed to regulate works without mqtt, so the device comes up in
  # the cheapest possible state and mqtt is switched on when wanted, from the
  # "MQTT" entry in the LCD menu or from Home Assistant (switch mqtt_state_id).
  # That switch's restore_mode has to stay in step with the value below - see
  # the comment there for why a mismatch silently overrides this line.
  #
  # HISTORY. Every mqtt reconnect used to block loopTask long enough for the 5s
  # task watchdog to reboot the device, so mqtt was off at boot and had to be
  # switched on by hand from the LCD menu. Measured back then:
  #   discovery on         -> watchdog reset every 2.5-5 minutes
  #   discovery off        -> one reset ~5 min after boot, then stable
  #   start delayed by 90s -> no effect, reset ~1 min after mqtt connected
  #   keepalive 60s        -> 18 min, then 1 min 40 s; no reliable improvement
  #   mqtt off entirely    -> 50+ minutes clean
  # Device-side signature: the loop went silent mid-interval (the sensor poll
  # simply stopped) with no mqtt log line before it, then the watchdog, with
  # loopTask starved while both CPUs sat in IDLE.
  #
  # Investigated and NOT the cause, kept so nobody re-runs it: the broker is on
  # THIS network but addressed by its public DynDNS name, so every packet took
  # the path device -> router -> NAT -> back into the LAN.
  #   mqtt.carstenwalther.de -> mqtt-walther.dynv6.net -> 92.206.232.135
  #   public IP of the network this device sits in     -> 92.206.232.135
  #   source address Mosquitto logs for this device    -> 92.206.232.135
  # The broker seeing the WAN address proves the router source-NATs its own
  # hairpin, which consumer routers do badly. Addressing the broker by its LAN
  # IP is still the better choice, but it was not what fixed this.
  #
  # Also NOT the cause: a duplicate client_id. Every "already connected, closing
  # old connection" in the broker log came from the same source address and was
  # immediately followed by the same client reconnecting - this device racing
  # its own stale session after a silent drop, not a second client. ESPHome
  # builds the id as device name + full MAC (dew-point-ventilation-ec64c98652d0),
  # which does not collide by accident. The "truncated to 23 characters" comment
  # in mqtt_client.h is stale; the buffer is MAX_NAME_WITH_SUFFIX_SIZE = 128.
  #
  # WATCH loop_time (sensor platform debug, further down) whenever mqtt is on.
  # It is the direct measurement of the thing that used to fail here, and the
  # whole table above was assembled without it.
  enable_on_boot: False

  # Back on: discovery bursts republish all ~50 entities on every reconnect and
  # used to block loopTask for 1.2-1.5s at a time, but that was a symptom of the
  # reconnect storm, not a cost worth avoiding on a stable connection. With it
  # off, newly added entities never reach Home Assistant on their own.
  discovery: True

  # Default is 15s. MEASURED: raising it moved the mean time between resets from
  # ~5min to 18min26s - and then the watchdog fired again after 1min40s. No
  # reliable improvement; kept only because a wider window genuinely lowers the
  # disconnect rate.
  # Device-side signature: the loop goes silent mid-interval (the sensor poll
  # simply stops) with no mqtt log line before it, then the watchdog, with
  # loopTask starved while both CPUs sit in IDLE.
  # Broker-side the dominant disconnect reason is "has exceeded timeout" (~35 in
  # one afternoon) against ~9 protocol errors.
  #
  # NOT the cause, although the log line exists: a duplicate client_id. Every
  # "already connected, closing old connection" in the broker log comes from the
  # same source address and is immediately followed by the same client
  # reconnecting - this device racing its own stale session after a silent drop,
  # not a second client. ESPHome builds the id as device name + full MAC
  # (dew-point-ventilation-ec64c98652d0), which does not collide by accident.
  # The "truncated to 23 characters" comment in mqtt_client.h is stale; the
  # buffer is MAX_NAME_WITH_SUFFIX_SIZE = 128, so the full 34 characters fit.
  #
  # Also tried and useless: delaying the mqtt start (enable_on_boot plus a timed
  # mqtt.enable). The reset came ~1 minute after mqtt connected, wherever in the
  # boot that fell.
  keepalive: 60s

#
# https://esphome.io/components/web_server
#
web_server:
  port: 80
  version: 3
  local: True
  # Every other channel into this device is authenticated - api has an
  # encryption key, ota a password, mqtt credentials, the fallback AP a
  # password. Without this block the web UI was the one open door, and it is
  # not read-only: it can switch the fan, rewrite every setpoint, restart the
  # device and press Factory Reset, which wipes the settings along with the
  # runtime, cycle and reset counters.
  #
  # type: digest is set explicitly rather than left to the default. ESPHome
  # currently defaults to basic, which puts the password on the wire in an
  # easily reversible form, and warns at validation time that the default flips
  # to digest in 2027.1.0. Naming it now is both safer and immune to that change.
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

#
# https://esphome.io/components/time
#
time:
  #
  # https://esphome.io/components/time/ds1307
  #
  - platform: ds1307
    id: ds1307_time
    address: 0x68
    # must match the sntp timezone: both share one global tz, and the manual
    # date/time entry below converts local fields to an epoch through it
    timezone: Europe/Berlin
    # repeated synchronization is not necessary unless the external RTC
    # is much more accurate than the internal clock
    update_interval: never

  #
  # https://esphome.io/components/time/sntp
  #
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    # instead try to synchronize via network repeatedly ...
    on_time_sync:
      then:
        # ... and update the RTC when the synchronization was successful
        ds1307.write_time:
          id: ds1307_time

#
# https://esphome.io/components/logger
#
logger:
  # WARN, not ERROR. ERROR hid the two things that mattered most while debugging
  # this device: the i2c "Using max allowed timeout: 13 ms" clamp warning, and
  # any sht3xd/ds1307 retry warning. It also silences nothing expensive - this
  # device logs no warnings in normal operation, so the extra level costs
  # nothing until something is actually wrong.
  # CONFIG (and with it the i2c bus scan) is still filtered out; raise to DEBUG
  # temporarily when you need the scan results.
  level: WARN

#
# https://esphome.io/components/debug
#
# Pulled in for exactly one thing: the reset_reason text sensor below, which
# names the cause of the last restart ("task watchdog", "interrupt watchdog",
# "brownout", "software via esp_restart", ...). That is the half of the reset
# statistics the counter cannot give - the count says how often, this says why.
# update_interval is long on purpose: the reason cannot change while running,
# and this device is sensitive to anything that adds work to the main loop.
#
debug:
  update_interval: 300s

################################################################################
#
# Specific Settings
#
################################################################################

#
# https://esphome.io/components/globals
#
globals:
  # Currently displayed page, selected with the rotary encoder:
  #   0 = measurements, 1 = WiFi info, 2 = sensor errors, 100 = OTA progress.
  # 100 is set by the OTA handlers and is outside the 0..2 range the encoder
  # scrolls through, so it can only be reached automatically, not by turning.
  - id: page_id
    type: int
    initial_value: '0'

  # ota::OTAState of the running update; -1 means "no OTA seen since boot",
  # which is outside the enum and therefore renders nothing on page 100
  - id: ota_state_id
    type: int
    restore_value: no
    initial_value: '-1'
  - id: ota_progress_id
    type: float
    restore_value: no
    initial_value: '0'
  - id: ota_error_id
    type: int
    restore_value: no
    initial_value: '0'

  # Set by the interval below when a SHT31 reports NaN. Read by control_script
  # (which then refuses to regulate) and by the display (error icon, page 2).
  - id: indoor_sensor_error_id
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: outdoor_sensor_error_id
    type: bool
    restore_value: no
    initial_value: 'false'

  # Why the fan is in its current state. control_script sets this on every path
  # it can take, including the ones that return early, so the value is never
  # stale. Rendered to text by fan_reason_text_id and shown on display page 3.
  # Codes: 0 ventilating, 1 difference too small, 2 indoor too cold,
  #        3 outdoor too cold, 4 sensor fault, 5 manual on, 6 manual off,
  #        7 held on by MIN_RUN_TIME_S, 8 held off by MIN_PAUSE_TIME_S
  - id: fan_reason_id
    type: int
    restore_value: no
    initial_value: '6'

  # Fan statistics. Runtime is accumulated in whole seconds when the fan stops;
  # while it runs, the in-progress part is added by the sensor lambda so the
  # reported value is never behind. Both survive a restart, but a power cut
  # loses whatever run was in progress - the preference is only written
  # periodically by ESPHome.
  - id: fan_runtime_s_id
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: fan_cycles_id
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # millis() when the current run started, 0 while stopped.
  - id: fan_on_since_ms_id
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # millis() of the last actual state change, for the min run/pause guards.
  # Unsigned arithmetic makes the millis() rollover after ~49 days harmless.
  - id: fan_last_change_ms_id
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Number of boots, incremented once per start by the priority-700 on_boot
  # block. Counts every restart alike - OTA, the Restart button, a power cut and
  # a watchdog reset are indistinguishable here, which is why the reset REASON
  # from the debug component sits next to it on display page 4 and in Home
  # Assistant. A factory reset clears the preference and the count starts at 0.
  # Only meaningful together with the uptime: a rising count at short uptimes is
  # the watchdog signature this device has a history of.
  - id: reset_count_id
    type: uint32_t
    restore_value: yes
    initial_value: '0'

#
# https://esphome.io/components/i2c
#
#
# Shared bus, four devices:
#   0x27 LCD (PCF8574)          0x44 SHT31 indoor
#   0x50 AT24C32 EEPROM         0x45 SHT31 outdoor
#   0x68 RTC (DS1307)
# 0x50 is the EEPROM riding along on the DS1307 breakout. Nothing here talks to
# it, but it is a useful probe when the RTC misbehaves: it shares VCC and both
# bus lines with the DS1307, so "0x50 answers, 0x68 does not" isolates the fault
# to the RTC chip itself rather than to power or wiring. To see it, set
# "scan: True" below and raise the logger to DEBUG - the scan results are logged
# at CONFIG level and are invisible at the WARN level this device normally runs.
# 100 kHz is the DS1307 maximum, so the bus cannot be clocked faster. The SHT31s
# would do 1 MHz and the PCF8574 400 kHz; the RTC is the limit.
#
i2c:
  id: i2c_id
  sda: ${PIN_I2C_SDA}
  scl: ${PIN_I2C_SCL}
  frequency: 100kHz
  # Maps to scl_wait_us, i.e. the clock-stretching timeout - NOT the transfer
  # timeout, which esphome hardcodes to 100ms in
  # i2c_bus_esp_idf.cpp: i2c_master_execute_defined_operations(..., 100).
  # This used to be 5ms, on the (then correct) assumption that no device on this
  # bus stretches the clock. The SHT31s broke that assumption: sht3xd::setup()
  # reads the serial number through register 0x3780, which is explicitly the
  # clock-stretching variant. If the sensor stretches longer than scl_wait_us the
  # master aborts mid-byte while the sensor still drives SDA, and a bus left in
  # that state takes every other device with it - the DS1307 included, whose
  # setup() calls mark_failed() on a single bad read and never retries.
  # 13ms is the ceiling, and writing it out is deliberate: IDFI2CBus::setup()
  # clamps anything larger to exactly this value and only says so at warning
  # level, which the logger used to swallow (it ran at ERROR) -
  #     if (this->timeout_ > 13000) { ESP_LOGW("Using max allowed timeout: 13ms");
  #                                   this->timeout_ = 13000; }
  # so a larger number here would just be a value the device never runs.
  # MEASURED: bounding this does NOT stop the watchdog resets. Tried 2026-08-02,
  # reset came 5 minutes after boot with the unchanged signature (loopTask
  # starved while both CPUs sit in IDLE). Do not expect a fix for that here.
  timeout: 13ms
  scan: False

#
# https://esphome.io/components/script
#
script:

  #
  # Ventilation control
  #
  # Single source of truth for the relais state. Called periodically by the
  # interval below and whenever the mode is changed.
  #
  - id: control_script
    mode: restart
    then:
      - lambda: |-
          // Every path sets fan_reason_id before it acts, so the reason a user
          // sees on page 3 and in Home Assistant always matches what the relay
          // is doing. The paths that return early are exactly the ones that
          // used to be invisible from outside - Fan=OFF looked identical for a
          // manual stop, a cold night, a broken sensor and a small difference.

          // manual override
          const auto mode = id(mode_id).current_option();
          if (mode == "On") {
            id(fan_reason_id) = 5;
            id(relais_id).turn_on();
            return;
          }
          if (mode == "Off") {
            id(fan_reason_id) = 6;
            id(relais_id).turn_off();
            return;
          }

          // automatic mode: never regulate on implausible sensor values
          if (id(indoor_sensor_error_id) || id(outdoor_sensor_error_id)) {
            id(fan_reason_id) = 4;
            id(relais_id).turn_off();
            return;
          }

          // Safety limits take precedence over the dew point difference. Split
          // into two checks so the reason can name the offending side.
          if (id(indoor_temperature_id).state < id(indoor_temperature_min_id).state) {
            id(fan_reason_id) = 2;
            id(relais_id).turn_off();
            return;
          }
          if (id(outdoor_temperature_id).state < id(outdoor_temperature_min_id).state) {
            id(fan_reason_id) = 3;
            id(relais_id).turn_off();
            return;
          }

          const float delta = id(indoor_dew_point_id).state - id(outdoor_dew_point_id).state;
          const float minimum = id(dew_point_difference_min_id).state;
          const bool running = id(relais_id).state;
          // unsigned subtraction, so a millis() rollover is harmless
          const uint32_t since_change = millis() - id(fan_last_change_ms_id);

          // dew point outside sufficiently lower than inside -> ventilate
          if (delta > minimum + id(hysteresis_id).state) {
            if (!running && since_change < ${MIN_PAUSE_TIME_S} * 1000UL) {
              id(fan_reason_id) = 8;  // wants to start, pause not over yet
              return;
            }
            id(fan_reason_id) = 0;
            id(relais_id).turn_on();
          }
          // difference collapsed -> stop
          else if (delta < minimum) {
            if (running && since_change < ${MIN_RUN_TIME_S} * 1000UL) {
              id(fan_reason_id) = 7;  // wants to stop, minimum runtime not met
              return;
            }
            id(fan_reason_id) = 1;
            id(relais_id).turn_off();
          }
          // in between: keep the current state (that is the hysteresis)
          else {
            id(fan_reason_id) = running ? 0 : 1;
          }

  #
  # Load the RTC into the datetime helper numbers
  #
  # Called when entering the Date/Time menus so that editing starts from the
  # current time instead of the numbers' initial values.
  #
  - id: datetime_load_script
    mode: single
    then:
      - lambda: |-
          auto now = id(ds1307_time).now();
          if (!now.is_valid()) {
            return;
          }
          id(datetime_second_id).publish_state(now.second);
          id(datetime_minute_id).publish_state(now.minute);
          id(datetime_hour_id).publish_state(now.hour);
          id(datetime_day_id).publish_state(now.day_of_month);
          id(datetime_month_id).publish_state(now.month);
          id(datetime_year_id).publish_state(now.year);

  #
  # Apply the datetime helper numbers to the system clock and the RTC
  #
  # Called when leaving the Date/Time menus, with a flag for the half that menu
  # actually edits. Everything else is taken from the clock as it reads right
  # now, NOT from the helper numbers.
  #
  # That distinction is the whole point. The numbers are a snapshot taken by
  # datetime_load_script when the menu was entered, and the Date menu only ever
  # edits three of the six. Writing all six back therefore restored the
  # hour/minute/second from the moment of entry and set the clock BACK by
  # however long the user spent in the menu - and it did so even when nothing
  # was edited, because on_leave fires either way.
  #
  # now() is the system clock (RealTimeClock::timestamp_now() is ::time(nullptr),
  # see real_time_clock.h), so reading it here costs nothing on the i2c bus.
  #
  - id: datetime_apply_script
    mode: single
    parameters:
      apply_date: bool
      apply_time: bool
    then:
      - lambda: |-
          auto now = id(ds1307_time).now();
          if (!now.is_valid()) {
            ESP_LOGE("datetime", "Clock invalid, refusing a partial update");
            return;
          }

          ESPTime t = now;
          if (apply_time) {
            t.second = (uint8_t) id(datetime_second_id).state;
            t.minute = (uint8_t) id(datetime_minute_id).state;
            t.hour = (uint8_t) id(datetime_hour_id).state;
          }
          if (apply_date) {
            t.day_of_month = (uint8_t) id(datetime_day_id).state;
            t.month = (uint8_t) id(datetime_month_id).state;
            t.year = (uint16_t) id(datetime_year_id).state;
          }

          // day_of_week and day_of_year are unknown when building from fields,
          // so exclude them from the range check
          if (!t.fields_in_range(false, false)) {
            ESP_LOGE("datetime", "Refusing to set invalid date/time");
            return;
          }

          // the helper numbers hold local time; this folds in tz and DST
          t.recalc_timestamp_local();
          if (t.timestamp == -1) {
            ESP_LOGE("datetime", "Could not convert local time to epoch");
            return;
          }

          // set the system clock first, then let the RTC copy it
          struct timeval tv = {};
          tv.tv_sec = t.timestamp;
          settimeofday(&tv, nullptr);

          id(ds1307_time).write_time();

  #
  # Wake the display and restart the backlight countdown
  #
  # THE single place that arms the backlight timer, called by every input path
  # (button, both encoder directions, boot). "No input for backlight_delay
  # seconds" is therefore the one and only condition that darkens the display.
  #
  # How the pulse works: ON switches the light on via the on_press trigger of
  # backlight_id, the immediately following OFF is held back by that sensor's
  # delayed_off filter and only lands once the delay has elapsed. Calling this
  # again while an OFF is pending restarts the countdown from zero, because
  # publish_state() has no deduplication and DelayedOffFilter::new_value(true)
  # cancels the pending timeout before re-arming it (binary_sensor/filter.cpp).
  #
  - id: backlight_wake_script
    mode: single
    then:
      - binary_sensor.template.publish:
          id: backlight_id
          state: ON
      - binary_sensor.template.publish:
          id: backlight_id
          state: OFF

#
# https://esphome.io/components/interval
#
interval:
  # Three times the 30s sensor interval: fast enough for the error icon on the
  # display, cheap enough to not run on every main loop pass
  - interval: 10s
    then:
      - lambda: |-
          // isnan() alone is not enough: a humidity element can die while still
          // answering with a valid checksum, reporting a frozen value. This
          // device ran with a constant 1.0% at plausible temperatures, which the
          // old check waved through - the resulting dew point of -32 C would
          // have kept the fan off forever without ever raising the error icon.
          // The datasheet range (0..100%) cannot catch that; only a bound that
          // comes from the room can.
          // The isnan() half of the check only works because the sht3xd sensors
          // carry a "timeout" filter - see the sensor section for why.
          const float indoor_h = id(indoor_humidity_id).state;
          const float indoor_t = id(indoor_temperature_id).state;
          id(indoor_sensor_error_id) = isnan(indoor_h) || isnan(indoor_t) ||
                                       indoor_h < 5.0f ||
                                       // NOTE: a damp cellar genuinely reaches
                                       // 95..100% RH - exactly the situation
                                       // this device exists for. Raise or drop
                                       // this bound if it ever faults a correct
                                       // reading.
                                       indoor_h > 99.5f;

          // Outdoor deliberately gets the lower bound only: outdoor air really
          // does sit at 100% RH in fog or rain, so an upper bound would fault
          // the sensor precisely when it is right.
          const float outdoor_h = id(outdoor_humidity_id).state;
          const float outdoor_t = id(outdoor_temperature_id).state;
          id(outdoor_sensor_error_id) = isnan(outdoor_h) || isnan(outdoor_t) ||
                                        outdoor_h < 5.0f;
      - script.execute: control_script

################################################################################
#
# Numbers
#
################################################################################

#
# https://esphome.io/components/number
#
number:

  #
  # Minimum dew point difference
  #
  - platform: template
    name: Minimum dew point difference
    id: dew_point_difference_min_id
    # temperature_delta, not temperature: this is a difference between two dew
    # points, not a reading. Home Assistant converts the two device classes
    # differently, and only the delta form is correct for a span.
    unit_of_measurement: "°C"
    device_class: temperature_delta
    min_value: 1.0
    max_value: 9.0
    initial_value: 5.0
    restore_value: True
    optimistic: True
    step: 0.5

  #
  # Hysteresis
  #
  - platform: template
    name: Hysteresis
    icon: mdi:chart-bell-curve-cumulative
    id: hysteresis_id
    # also a span, not a reading - see the dew point difference above
    unit_of_measurement: "°C"
    device_class: temperature_delta
    min_value: 0.0
    max_value: 5.0
    initial_value: 1.0
    restore_value: True
    optimistic: True
    step: 0.5

  #
  # Indoor temperature minimum
  #
  - platform: template
    name: Indoor temperature minimum
    icon: mdi:thermometer-low
    id: indoor_temperature_min_id
    # without these the entity is a bare number in Home Assistant; the lcd_menu
    # ignores both and needs its own value_lambda (see the System menu below)
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 5.0
    max_value: 25.0
    initial_value: 8.0
    restore_value: True
    optimistic: True
    step: 1.0

  #
  # Outdoor temperature minimum
  #
  - platform: template
    name: Outdoor temperature minimum
    icon: mdi:thermometer-low
    id: outdoor_temperature_min_id
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: -30.0
    max_value: 20.0
    initial_value: 5.0
    restore_value: True
    optimistic: True
    step: 1.0

  #
  # Backlight delay
  #
  - platform: template
    name: Backlight delay
    id: backlight_delay_id
    min_value: 3.0
    max_value: 180.0
    initial_value: 10.0
    restore_value: True
    optimistic: True
    internal: True
    step: 1.0

  #
  # Datetime helpers
  #
  # The LCD menu can only edit numbers, so the clock is split into six of them.
  # They are internal scratch values, not settings: datetime_load_script fills
  # them from the RTC when the Date/Time menu is entered and
  # datetime_apply_script writes them back on leaving. Hence no restore_value --
  # the initial_values below are never seen in practice.
  # The ranges are per-field only; an impossible date such as 31 February is
  # rejected by datetime_apply_script, not here.
  #

  #
  # Day
  #
  - platform: template
    name: Day
    id: datetime_day_id
    min_value: 1
    max_value: 31
    initial_value: 1
    optimistic: True
    internal: True
    step: 1.0

  #
  # Month
  - platform: template
    name: Month
    id: datetime_month_id
    min_value: 1
    max_value: 12
    initial_value: 1
    optimistic: True
    internal: True
    step: 1.0

  #
  # Year
  - platform: template
    name: Year
    id: datetime_year_id
    min_value: 2024
    max_value: 2100
    initial_value: 2024
    optimistic: True
    internal: True
    step: 1.0

  #
  # Hour
  - platform: template
    name: Hour
    id: datetime_hour_id
    min_value: 0
    max_value: 23
    initial_value: 12
    optimistic: True
    internal: True
    step: 1.0

  #
  # Minute
  - platform: template
    name: Minute
    id: datetime_minute_id
    min_value: 0
    max_value: 59
    initial_value: 0
    optimistic: True
    internal: True
    step: 1.0

  #
  # Second
  - platform: template
    name: Second
    id: datetime_second_id
    min_value: 0
    max_value: 59
    initial_value: 0
    optimistic: True
    internal: True
    step: 1.0

################################################################################
#
# Text Sensors
#
################################################################################

#
# https://esphome.io/components/text_sensor
#
text_sensor:

  #
  # Reset Reason
  # https://esphome.io/components/text_sensor/debug
  #
  # Cause of the last restart, straight from esp_reset_reason(). Read this
  # together with Reset Count: the count alone cannot tell an OTA apart from a
  # watchdog, and "task watchdog" at a low uptime is the exact signature this
  # device has a documented history of (see the mqtt section).
  #
  - platform: debug
    reset_reason:
      id: reset_reason_id
      name: Reset Reason
      icon: mdi:restart-alert
      entity_category: diagnostic

  #
  # Fan state reason
  # https://esphome.io/components/text_sensor/template
  #
  # Answers "why is the fan not running?", which used to be invisible: the only
  # outward signal was Fan=OFF, identical for a manual stop, a cold night, a
  # broken sensor and a difference that is simply too small.
  # Strings stay within 20 characters so they fit one LCD row unabbreviated.
  #
  - platform: template
    id: fan_reason_text_id
    name: Fan State Reason
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      switch (id(fan_reason_id)) {
        case 0: return {"Ventilating"};
        case 1: return {"Diff too small"};
        case 2: return {"Indoor too cold"};
        case 3: return {"Outdoor too cold"};
        case 4: return {"Sensor fault"};
        case 5: return {"Manual: On"};
        case 6: return {"Manual: Off"};
        case 7: return {"Min runtime hold"};
        case 8: return {"Min pause hold"};
      }
      return {"Unknown"};

  #
  # ESPHome Version
  # https://esphome.io/components/text_sensor/version
  #
  - platform: version
    name: ESPHome Version
    icon: mdi:new-box

  #
  # Firmware Version
  #
  - platform: template
    name: Firmware Version
    icon: mdi:new-box
    update_interval: 60s
    lambda: |-
      return {"$version"};

  #
  # Device Uptime
  #
  - platform: template
    name: Device Uptime
    icon: mdi:clock-start
    entity_category: diagnostic
    device_class: ""
    lambda: |-
          // The uptime sensor only publishes from update(), so its state is NaN
          // until the first poll. Test that BEFORE the cast: converting a NaN
          // float to int is undefined behaviour, and the guard this replaces
          // ("days > 3650") assumed the cast would yield a huge positive value.
          // It generally does not, so the fallback below never actually fired
          // and the first minute showed whatever the conversion happened to
          // produce.
          const float uptime = id(uptime_seconds_id).state;
          if (std::isnan(uptime)) {
            return {"Starting up"};
          }

          int seconds = (int) uptime;
          int days = seconds / (24 * 3600);

          seconds = seconds % (24 * 3600);

          int hours = seconds / 3600;
          seconds = seconds % 3600;

          int minutes = seconds /  60;
          seconds = seconds % 60;

          char buf[32];
          if (days) {
            snprintf(buf, sizeof(buf), "%dd %dh %dm %ds", days, hours, minutes, seconds);
          } else if (hours) {
            snprintf(buf, sizeof(buf), "%dh %dm %ds", hours, minutes, seconds);
          } else if (minutes) {
            snprintf(buf, sizeof(buf), "%dm %ds", minutes, seconds);
          } else {
            snprintf(buf, sizeof(buf), "%ds", seconds);
          }
          return {buf};

  #
  # WiFi Information
  # https://esphome.io/components/text_sensor/wifi_info
  #
  - platform: wifi_info
    ssid:
      name: SSID
      icon: mdi:wifi-star
    ip_address:
      id: ip_address_id
      name: IP Address
      icon: mdi:ip-network-outline
    dns_address:
      name: DNS Address
      icon: mdi:dns-outline

################################################################################
#
# Binary Sensors
#
################################################################################

#
# https://esphome.io/components/binary_sensor
#
binary_sensor:

  #
  # Rotary Encoder Button
  # https://esphome.io/components/binary_sensor/gpio
  #
  - platform: gpio
    # the KY-040 breakout only pulls up CLK and DT, not SW
    pin:
      number: ${PIN_ROTARY_ENCODER_SW}
      mode: INPUT_PULLUP
      inverted: True
    name: Menu
    internal: True
    # mechanical switch: swallow contact bounce in both directions
    filters:
      - delayed_on: 15ms
      - delayed_off: 15ms
    # First press with a dark display only wakes the backlight and is swallowed,
    # so nobody triggers a menu action blindly. Afterwards: open the menu, or
    # confirm the highlighted entry if it is already open.
    #
    # Order matters: the action is decided from the backlight state BEFORE this
    # press re-arms the timer, otherwise the wake-up press would act as well.
    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: backlight_id
            then:
              - if:
                  condition:
                    display_menu.is_active:
                  then:
                    - display_menu.enter:
                  else:
                    - display_menu.show:
        - script.execute: backlight_wake_script

  #
  # Fan State
  # https://esphome.io/components/binary_sensor/template
  #
  # The relais itself stays internal so that nothing can bypass control_script.
  # This mirrors its state read-only into Home Assistant / MQTT.
  #
  - platform: template
    id: fan_state_id
    name: Fan
    icon: mdi:fan
    device_class: running
    lambda: |-
      return id(relais_id).state;

  #
  # Backlight
  # https://esphome.io/components/binary_sensor/template
  #
  # Not a real sensor but a retriggerable one-shot timer, armed exclusively by
  # backlight_wake_script: the ON lights the display through on_press, the OFF
  # that follows is held back by the delayed_off filter and turns it off again
  # through on_release once backlight_delay has passed with no further input.
  #
  # Its state doubles as "is the display currently lit", which every input path
  # tests to decide whether a press or a turn acts or merely wakes the display.
  # That only holds because the timer is re-armed on every input - if some input
  # path forgets to call the script, this sensor goes OFF while the display is
  # still lit and the next input is silently swallowed.
  #
  - platform: template
    id: backlight_id
    internal: True
    # defaults to False, and the on_boot wake is the very first state this
    # sensor ever sees -- without this its on_press is swallowed and the boot
    # pulse would only ever switch the backlight off
    trigger_on_initial_state: True
    filters:
      # backlight_delay_id is a template number with setup_priority HARDWARE,
      # the same 800 the on_boot trigger uses, and it is registered later, so
      # its state is still NaN during the boot pulse. Fall back to the number's
      # initial_value instead of casting NaN to uint32_t.
      - delayed_off: !lambda |-
          float seconds = id(backlight_delay_id).state;
          if (std::isnan(seconds)) {
            seconds = 10.0f;
          }
          return seconds * 1000;
    on_press:
      then:
        - lambda: |-
            id(display_id).backlight();
    on_release:
      then:
        # Unconditional: reaching this means backlight_delay has passed without
        # a single input. This used to be guarded by !lcd_menu_id.is_active(),
        # which froze the light on for as long as the menu was open - necessary
        # back when menu navigation did not re-arm the timer, but it also left
        # backlight_id OFF while the display was lit, and the next button press
        # was then swallowed by the "dark display" branch instead of acting.
        # Now that every input calls backlight_wake_script, the menu keeps
        # itself lit by being used and the guard is gone.
        - lambda: |-
            id(display_id).no_backlight();

################################################################################
#
# Selects
#
################################################################################

#
# https://esphome.io/components/select
#
select:

  #
  # Mode
  # https://esphome.io/components/select/template
  #
  - platform: template
    name: Mode
    id: mode_id
    icon: mdi:light-switch
    options:
      - "Automatic"
      - "On"
      - "Off"
    initial_option: "Automatic"
    optimistic: True
    # deliberately not restored: after a power cut the device comes back in
    # Automatic rather than staying in a manual override nobody remembers
    restore_value: False
    # react immediately instead of waiting for the next interval tick
    on_value:
      then:
        - script.execute: control_script

################################################################################
#
# Buttons
#
################################################################################

#
# https://esphome.io/components/button
#
button:

  #
  # Restart
  # https://esphome.io/components/button/restart
  #
  - platform: restart
    id: restart_id
    name: Restart
    icon: mdi:reload

  #
  # Factory Reset
  # https://esphome.io/components/button/factory_reset
  #
  # internal: True keeps the single most destructive action in this config off
  # every remote surface - Home Assistant, MQTT (which publishes it now that
  # discovery is on) and the web UI. It wipes all preferences: the setpoints,
  # the fan runtime and cycle counters, and the reset count.
  #
  # It stays reachable from the LCD menu: internal only controls whether an
  # entity is exposed to frontends, the object still exists and the menu's
  # "button.press: factoryreset_id" works unchanged. Someone has to stand at the
  # device to trigger it, which is the right bar for this one.
  #
  # Note the menu entry fires on a single press with no confirmation step. That
  # is a misclick away on a rotary encoder; a confirm submenu would be the fix
  # if it ever actually happens.
  - platform: factory_reset
    id: factoryreset_id
    name: Factory Reset
    icon: mdi:restart
    internal: True

  #
  # Save Mode
  # https://esphome.io/components/button/safe_mode
  #
  - platform: safe_mode
    id: safemode_id
    name: Restart (Safe Mode)
    icon: mdi:reload

################################################################################
#
# Sensors
#
################################################################################

#
# https://esphome.io/components/sensor/index
#
# The climate sensors and everything derived from them run at 30s. Faster buys
# nothing: control_script only runs every 10s (see the interval above), so the
# extra readings would never be evaluated, and every poll costs transfers on the
# same i2c bus the LCD already keeps busy.
# A cellar is thermally slow; 30s is still far finer than anything the room
# does. The visible cost is that breathing on a sensor takes up to 30s to show.
#
# WHY EVERY SHT31 VALUE CARRIES A "timeout" FILTER
# The two climate sensors are the only inputs the dew point logic has, so a
# sensor that stops answering must become visible. It no longer does so by
# itself: on a failed read the sht3xd driver calls status_set_warning() and
# returns WITHOUT publishing anything (sht3xd.cpp), so the sensor keeps its last
# value forever. The dht driver this replaced published NAN instead
# (dht.cpp: publish_state(NAN)), which is what the isnan() checks in the
# interval above were written against - unfiltered, they would never fire again
# and the fan would keep regulating on a frozen reading from a dead sensor.
# The filter restores that behaviour: no update within 90s (three missed polls)
# publishes nan, which the interval turns into the sensor error.
sensor:

  #
  # Uptime
  # https://esphome.io/components/sensor/uptime
  #
  - platform: uptime
    id: uptime_seconds_id
    name: Uptime
    icon: mdi:timer-outline
    type: seconds
    internal: True
    entity_category: diagnostic
    device_class: ""

  #
  # WiFi Signal in dB
  # https://esphome.io/components/sensor/wifi_signal
  #
  - platform: wifi_signal
    id: wifi_signal_db
    name: WiFi Signal (dBm)
    icon: mdi:wifi
    unit_of_measurement: "dBm"
    update_interval: 60s

  #
  # WiFi Signal in %
  # https://esphome.io/components/sensor/wifi_signal
  #
  - platform: copy
    id: wifi_signal_percent
    name: WiFi Signal (%)
    icon: mdi:wifi
    source_id: wifi_signal_db
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    filters:
    # map dBm to percent: -100 dBm and worse = 0 %, -50 dBm and better = 100 %
    - lambda: |-
        return min(max(2 * (x + 100.0), 0.0), 100.0);

  #
  # Rotary Encoder
  # https://esphome.io/components/sensor/rotary_encoder
  #
  # CLK/DT need no pin mode here: the KY-040 breakout pulls both up itself.
  # Turning either navigates the menu (when open) or flips the display page.
  # Like the button, the first turn with a dark display only wakes it - which
  # now also holds inside the menu, where the old code navigated blind.
  - platform: rotary_encoder
    id: rotary_encoder_id
    name: Rotary Encoder
    internal: True
    pin_a: ${PIN_ROTARY_ENCODER_CLK}
    pin_b: ${PIN_ROTARY_ENCODER_DT}
    restore_mode: ALWAYS_ZERO
    # note: this only debounces the published counter value, not the
    # on_clockwise/on_anticlockwise triggers, which fire from the raw pins
    filters:
      debounce: 30ms
    on_anticlockwise:
      # same shape as the button: act on the pre-wake backlight state, then
      # re-arm unconditionally so navigating the menu keeps the light on
      - if:
          condition:
            binary_sensor.is_on: backlight_id
          then:
            - if:
                condition:
                  display_menu.is_active:
                then:
                  - display_menu.up:
                else:
                  - globals.set:
                      id: page_id
                      value: !lambda |-
                        return id(page_id) -= 1;
                  - if:
                      condition:
                        # > 4 also catches the OTA page (100), which would
                        # otherwise take ~96 clicks to leave
                        lambda: |-
                          return id(page_id) <= 0 || id(page_id) > 4;
                      then:
                        - globals.set:
                            id: page_id
                            value: !lambda |-
                              return 0;
      - script.execute: backlight_wake_script

    on_clockwise:
      - if:
          condition:
            binary_sensor.is_on: backlight_id
          then:
            - if:
                condition:
                  display_menu.is_active:
                then:
                  - display_menu.down:
                else:
                  - globals.set:
                      id: page_id
                      value: !lambda |-
                        return id(page_id) += 1;
                  - if:
                      condition:
                        lambda: |-
                          return id(page_id) >= 4;
                      then:
                        - globals.set:
                            id: page_id
                            value: !lambda |-
                              return 4;
      - script.execute: backlight_wake_script

  #
  # Delta Dew Point
  # https://esphome.io/components/sensor/template
  #
  #
  # Fan statistics
  # https://esphome.io/components/sensor/template
  #
  # Runtime tells you whether the settings actually do anything - never running
  # and always running are both worth noticing. The cycle count is the wear
  # indicator for the relay contacts.
  #
  - platform: template
    id: fan_runtime_h_id
    name: Fan Runtime
    icon: mdi:timer-outline
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      // add the run in progress so the value never lags a whole run behind
      uint32_t seconds = id(fan_runtime_s_id);
      if (id(fan_on_since_ms_id) != 0) {
        seconds += (millis() - id(fan_on_since_ms_id)) / 1000;
      }
      return seconds / 3600.0f;

  - platform: template
    id: fan_cycles_sensor_id
    name: Fan Switch Cycles
    icon: mdi:counter
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return id(fan_cycles_id);

  #
  # Runtime health
  # https://esphome.io/components/sensor/debug
  #
  # loop_time is the reason this block exists: it measures how long the main
  # loop takes, which is exactly what failed during the watchdog-reset period -
  # loopTask starved while both CPUs sat in IDLE. A trend line beats the
  # after-the-fact guessing the mqtt comments above are full of, and it is the
  # measurement to watch whenever mqtt is switched on.
  #
  # It is a MAXIMUM, not a sample. DebugComponent::loop() keeps a running
  # max_loop_time_ and update() publishes it and resets it to zero, so each
  # reading is the worst single iteration since the previous one. A long
  # interval therefore never misses a spike, it only coarsens when the spike
  # happened - drop the debug component's update_interval temporarily if a
  # value needs to be tied to a specific event.
  # The heap sensors come along nearly free and would catch the other classic
  # cause of late resets, a slow leak or a fragmenting heap.
  # All of these inherit entity_category: diagnostic from the platform schema
  # and are published on the debug component's 300s interval.
  #
  - platform: debug
    loop_time:
      id: loop_time_id
      name: Loop Time
      icon: mdi:timer-sync-outline
    free:
      name: Heap Free
      icon: mdi:memory
    fragmentation:
      name: Heap Fragmentation
      icon: mdi:memory

  #
  # Reset Count
  # https://esphome.io/components/sensor/template
  #
  # Restarts since the last factory reset, incremented once per boot. Rarely
  # changes, so a slow update interval is enough - the value it reports is
  # already final by the time the first update runs.
  #
  - platform: template
    id: reset_count_sensor_id
    name: Reset Count
    icon: mdi:restart-alert
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return id(reset_count_id);

  #
  # Delta Dew Point
  # https://esphome.io/components/sensor/template
  #
  # Indoor minus outdoor, so a positive value means the outside air is drier
  # and ventilating removes moisture. This is the quantity control_script
  # compares against dew_point_difference_min; published for observability
  # only, the script recomputes it to stay independent of this sensor's cycle.
  #
  # "never" plus a component.update from both sources, rather than a poll: the
  # dew point sensors publish the instant a measurement arrives, so a 30s poll
  # here would have this difference lagging its own inputs by up to a full
  # interval. temperature_delta rather than temperature - it is a span between
  # two dew points, matching dew_point_difference_min_id.
  # Recomputing twice when both sources update back to back is harmless; the
  # second pass produces the value that stands.
  - platform: template
    id: delta_dew_point_id
    name: Delta Dew Point
    icon: mdi:thermometer-alert
    unit_of_measurement: °C
    device_class: temperature_delta
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return id(indoor_dew_point_id).state - id(outdoor_dew_point_id).state;

  #
  # Absolute Humidity Delta
  # https://esphome.io/components/sensor/template
  #
  # Same sign convention as the dew point delta above, and driven the same way:
  # "never" plus a component.update from both source sensors. Diagnostic only --
  # nothing regulates on this, it just makes the moisture transport visible.
  #
  - platform: template
    id: absolute_humidity_delta_id
    name: Absolute Humidity Delta
    icon: mdi:water-percent-alert
    unit_of_measurement: g/m³
    device_class: absolute_humidity
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return id(indoor_absolute_humidity_id).state - id(outdoor_absolute_humidity_id).state;

  #
  # Outdoor Temperature
  # https://esphome.io/components/sensor/sht3xd
  #
  - platform: sht3xd
    address: 0x45          # ADDR-Pin auf VDD
    update_interval: 30s
    temperature:
      id: outdoor_temperature_id
      name: Outdoor Temperature
      icon: mdi:thermometer
      accuracy_decimals: 1
      # see "WHY EVERY SHT31 VALUE CARRIES A timeout FILTER" above
      filters:
        - timeout: 90s
    humidity:
      id: outdoor_humidity_id
      name: Outdoor Humidity
      icon: mdi:water-percent
      accuracy_decimals: 1
      filters:
        - timeout: 90s

  #
  # Outdoor Dew Point
  # https://esphome.io/components/sensor/dew_point
  #
  # Was a template sensor with a hand-written Magnus formula. The platform is
  # better on two counts:
  #   - It is callback-driven (add_on_state_callback on both sources), so it
  #     recomputes the moment a reading arrives. The template version polled on
  #     its own 30s clock, independent of the sensors' 30s clock, so the value
  #     control_script reads could be a full extra interval behind.
  #   - It publishes NAN when a source is NaN or the humidity is outside
  #     (0, 100]. The old lambda clamped RH to 0.1% instead, which turned a
  #     0% reading into a plausible-looking dew point near -60 C.
  # Note the constants differ slightly: the platform uses a=17.625 / b=243.04
  # (Alduchov-Eskridge), the old lambda 17.67 / 243.5. Under 0.1 C apart in this
  # range - invisible against a threshold adjustable in 0.5 C steps.
  # unit, device_class and state_class come from the platform schema.
  #
  - platform: dew_point
    id: outdoor_dew_point_id
    name: Outdoor Dew Point
    icon: mdi:thermometer-alert
    temperature: outdoor_temperature_id
    humidity: outdoor_humidity_id
    accuracy_decimals: 1
    # drives the difference sensor, which polls "never"
    on_value:
      - component.update: delta_dew_point_id

  #
  # Outdoor Absolute Humidity
  # https://esphome.io/components/sensor/absolute_humidity
  #
  - platform: absolute_humidity
    id: outdoor_absolute_humidity_id
    name: Outdoor Absolute Humidity
    icon: mdi:water-percent-alert
    unit_of_measurement: g/m³
    temperature: outdoor_temperature_id
    humidity: outdoor_humidity_id
    accuracy_decimals: 1
    # drives the difference sensor, which polls "never"
    on_value:
      - component.update: absolute_humidity_delta_id

  #
  # Indoor Temperature
  # https://esphome.io/components/sensor/sht3xd
  #
  - platform: sht3xd
    address: 0x44          # ADDR-Pin auf GND
    update_interval: 30s
    temperature:
      id: indoor_temperature_id
      name: Indoor Temperature
      icon: mdi:thermometer
      accuracy_decimals: 1
      # see "WHY EVERY SHT31 VALUE CARRIES A timeout FILTER" above
      filters:
        - timeout: 90s
    humidity:
      id: indoor_humidity_id
      name: Indoor Humidity
      icon: mdi:water-percent
      accuracy_decimals: 1
      filters:
        - timeout: 90s

  #
  # Indoor Dew Point
  # https://esphome.io/components/sensor/dew_point
  #
  # see the outdoor dew point above for why this is a platform, not a lambda
  - platform: dew_point
    id: indoor_dew_point_id
    name: Indoor Dew Point
    icon: mdi:thermometer-alert
    temperature: indoor_temperature_id
    humidity: indoor_humidity_id
    accuracy_decimals: 1
    # drives the difference sensor, which polls "never"
    on_value:
      - component.update: delta_dew_point_id

  #
  # Indoor Absolute Humidity
  # https://esphome.io/components/sensor/absolute_humidity
  #
  - platform: absolute_humidity
    id: indoor_absolute_humidity_id
    name: Indoor Absolute Humidity
    icon: mdi:water-percent-alert
    unit_of_measurement: g/m³
    temperature: indoor_temperature_id
    humidity: indoor_humidity_id
    accuracy_decimals: 1
    # drives the difference sensor, which polls "never"
    on_value:
      - component.update: absolute_humidity_delta_id

################################################################################
#
# Switches
#
################################################################################

#
# https://esphome.io/components/switch/index
#
switch:

  #
  # Relais
  # https://esphome.io/components/switch/gpio
  #
  # Drives the fan. Kept internal on purpose: control_script owns this switch,
  # and a second writer from Home Assistant would be overridden on the next
  # interval tick. The read-only fan_state_id binary sensor mirrors it for HA;
  # to control the fan from outside, set mode_id instead.
  #
  # No restore_mode, i.e. the schema default ALWAYS_OFF, which is the one we
  # want: the fan starts off and control_script decides from there. All three
  # switches in this file depend on that default doing something, so it is worth
  # knowing what it is - see the WiFi switch below for the full mechanism.
  - platform: gpio
    id: relais_id
    name: Fan
    icon: mdi:fan
    pin: ${PIN_RELAIS}
    internal: True
    # Switch::publish_state() runs the value through a deduplicator, so these
    # fire on real transitions only - not on every turn_on() that control_script
    # issues each interval tick. That makes them safe as counting points.
    on_turn_on:
      then:
        - lambda: |-
            id(fan_on_since_ms_id) = millis();
            id(fan_last_change_ms_id) = millis();
            id(fan_cycles_id) += 1;
    on_turn_off:
      then:
        - lambda: |-
            if (id(fan_on_since_ms_id) != 0) {
              id(fan_runtime_s_id) += (millis() - id(fan_on_since_ms_id)) / 1000;
              id(fan_on_since_ms_id) = 0;
            }
            id(fan_last_change_ms_id) = millis();

  #
  # WiFi
  # https://esphome.io/components/switch/template
  #
  # Lets the user shut the radio off from the LCD menu, e.g. to silence the
  # device. The lambda reports the real radio state, so the switch stays
  # correct even if WiFi is toggled from somewhere else.
  #
  # internal: True - an LCD-only control, and not merely as a matter of taste.
  # Home Assistant reaches this device THROUGH the radio this switch turns off,
  # so a remote "off" is a one-way trip: the entity that would switch it back on
  # disappears with the connection that carried the command, and someone has to
  # walk to the cellar. A control whose remote use can only ever strand the
  # device does not belong on a remote surface.
  #
  # restore_mode: DISABLED - the one mode that makes setup() do nothing at all.
  # It has to be spelled out because the schema default is ALWAYS_OFF, and a
  # template switch does not merely publish its restored state, it acts on it:
  #
  #   if (initial_state.value()) { this->turn_on(); } else { this->turn_off(); }
  #
  # So the default had this switch fire turn_off_action - a full wifi.disable()
  # with wifi_disconnect_() and wifi_mode_(false, false) - on every single boot.
  # And it ran early: a template switch sets up at HARDWARE - 2 (798), while
  # WiFiComponent::setup() runs at priority WIFI (250), so the teardown hit a
  # stack that had not been initialised yet.
  #
  # Nothing visibly broke, which is why it survived so long: WiFiComponent::setup()
  # checks enable_on_boot_ afterwards and starts the radio regardless, and the
  # lambda below then reports the true state, so the switch corrects itself.
  # DISABLED simply removes the pointless round trip.
  #
  # Restoring a state would be wrong here in any case. This switch has a lambda,
  # i.e. it mirrors the radio rather than owning it, so there is nothing to
  # restore - the answer is whatever WiFiComponent is currently doing. Contrast
  # the MQTT switch below, which has no getter worth polling and therefore does
  # have to carry a restore_mode that matches its component's enable_on_boot.
  #
  - platform: template
    id: wifi_state_id
    name: "WiFi"
    icon: "mdi:wifi"
    internal: True
    optimistic: True
    restore_mode: DISABLED
    lambda: |-
      if (!id(wifi_id).is_disabled()) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      then:
        - wifi.enable:
    turn_off_action:
      then:
        - wifi.disable:

  #
  # MQTT
  # https://esphome.io/components/switch/template
  #
  # Lets the user bring mqtt up or down from the LCD menu without reflashing.
  # Deliberately NOT mirroring the real state with a lambda the way the WiFi
  # switch does: the only getter available is is_connected(), so the switch
  # would snap back to off whenever the broker is briefly unreachable and look
  # broken. The status bar makes the distinction instead - hollow disc for
  # enabled but not connected, filled for connected.
  #
  # internal: True for the same reason as the WiFi switch: switching mqtt off
  # over mqtt removes the entity that would switch it back on. Home Assistant
  # can still reach the device over the api in that case, but the control it
  # would need is exactly the one that just vanished from its registry. It also
  # simply has no job there - mqtt off at boot is the intended default, and
  # turning it on is something you do standing at the device.
  #
  # ALWAYS_OFF has to track "enable_on_boot: False" in the mqtt block, and the
  # coupling is not cosmetic: TemplateSwitch::setup() acts on the restored state
  # rather than just publishing it. It calls turn_on()/turn_off() outright,
  # firing the actions below - so a mismatch here silently overrides
  # enable_on_boot a moment after boot, and the config validates happily while
  # doing it. Change one, change the other.
  #
  - platform: template
    id: mqtt_state_id
    name: "MQTT"
    icon: "mdi:transit-connection-variant"
    internal: True
    optimistic: True
    restore_mode: ALWAYS_OFF
    turn_on_action:
      then:
        - mqtt.enable:
    turn_off_action:
      then:
        - mqtt.disable:

################################################################################
#
# LCD
#
################################################################################

#
# https://esphome.io/components/display_menu/lcd_menu
#
lcd_menu:
  id: lcd_menu_id
  display_id: display_id
  active: False
  mode: rotary
  mark_back: 0x08
  mark_selected: 0x3e
  mark_editing: 0x2a
  mark_submenu: 0x7e
  items:

    #
    # Mode
    #
    - type: select
      text: 'Mode'
      immediate_edit: False
      select: mode_id

    #
    # Settings
    #
    - type: menu
      text: 'Settings'
      items:
        - type: back
          text: 'Back'
        - type: number
          text: 'Dew point diff. min.'
          immediate_edit: False
          number: dew_point_difference_min_id
        - type: number
          text: 'Hysteresis'
          immediate_edit: False
          number: hysteresis_id
        # These two show the unit, which "format" cannot do: it is validated
        # against ^%[+-]*(\d+)?(\.\d+)?[fg]$, so any trailing text is rejected,
        # and MenuItemNumber::get_value_text() never looks at the number's
        # unit_of_measurement. value_lambda is the only way in. \x01 is the
        # degree glyph from user_characters, split from the "C" so the compiler
        # does not read \x01C as one hex escape - same idiom as the display.
        #
        # Column budget, from LCDCharacterMenuComponent::draw_item(): the value
        # is right-aligned as " [value]" ending at column 18, so it starts at
        # 20 - strlen(value) - 4. "-30\x01C" is 5 wide -> starts at 11, and the
        # label is cut to 10 characters. Hence the shortened texts: the old
        # 'Out. temp. min.' was already being clipped to 'Out. temp. m' by the
        # bare '%.0f' value, only less obviously.
        - type: number
          text: 'Indoor min'
          immediate_edit: False
          number: indoor_temperature_min_id
          value_lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.0f\x01" "C", id(indoor_temperature_min_id).state);
            return std::string(buf);
        - type: number
          text: 'Outdoor min'
          immediate_edit: False
          number: outdoor_temperature_min_id
          value_lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.0f\x01" "C", id(outdoor_temperature_min_id).state);
            return std::string(buf);
        - type: back
          text: 'Back'
    #
    # System
    #
    - type: menu
      text: 'System'
      items:
        - type: back
          text: 'Back'
        - type: menu
          text: 'Date'
          on_enter:
            then:
              - script.execute: datetime_load_script
          on_leave:
            then:
              # only the calendar half; the time of day keeps running
              - script.execute:
                  id: datetime_apply_script
                  apply_date: true
                  apply_time: false
          items:
            - type: back
              text: 'Back'
            - type: number
              text: 'Day'
              immediate_edit: False
              number: datetime_day_id
              format: "%.0f"
            - type: number
              text: 'Month'
              immediate_edit: False
              number: datetime_month_id
              format: "%.0f"
            - type: number
              text: 'Year'
              immediate_edit: False
              number: datetime_year_id
              format: "%.0f"
            - type: back
              text: 'Back'
        - type: menu
          text: 'Time'
          on_enter:
            then:
              - script.execute: datetime_load_script
          on_leave:
            then:
              # only the clock half; the date is taken from the running clock
              - script.execute:
                  id: datetime_apply_script
                  apply_date: false
                  apply_time: true
          items:
            - type: back
              text: 'Back'
            - type: number
              text: 'Hour'
              immediate_edit: False
              number: datetime_hour_id
              format: "%.0f"
            - type: number
              text: 'Minute'
              immediate_edit: False
              number: datetime_minute_id
              format: "%.0f"
            - type: number
              text: 'Second'
              immediate_edit: False
              number: datetime_second_id
              format: "%.0f"
            - type: back
              text: 'Back'
        - type: number
          text: 'Backlight delay'
          immediate_edit: False
          number: backlight_delay_id
          format: "%.0f"
        - type: switch
          text: 'WiFi'
          immediate_edit: False
          switch: wifi_state_id
        - type: switch
          text: 'MQTT'
          immediate_edit: False
          switch: mqtt_state_id
        - type: command
          text: 'Restart'
          on_value:
            then:
              button.press: restart_id
        - type: command
          text: 'Factory Reset'
          on_value:
            then:
              button.press: factoryreset_id
        - type: back
          text: 'Back'

    #
    # Exit Menu
    #
    - type: command
      text: !lambda |-
        return "Exit Menu";
      on_value:
        then:
          # No backlight pulse needed here any more: this runs from inside the
          # button's on_press, which re-arms the timer on its way out.
          - display_menu.hide:

#
# https://esphome.io/components/display/lcd_display
#
display:
  - platform: lcd_pcf8574
    dimensions: 20x4
    address: 0x27
    id: display_id
    # A full 20x4 redraw is 84 bytes * 2 nibbles * 3 single-byte I2C transfers
    # = 504 transfers, measured at ~170ms on this 100 kHz bus. lcd_base redraws
    # everything unconditionally, so that cost is paid on every update. At the
    # former 250ms that tied up ~68% of the main loop and showed up as stalls in
    # unrelated components (api 2163ms, mqtt keepalive dropping with
    # No PING_RESP). 1s keeps it under 20%; menu navigation and OTA progress
    # stay responsive because both call update() directly.
    # The bus cannot go to 400 kHz: the DS1307 at 0x68 is a 100 kHz part.
    # NOTE: this is throughput hygiene, not the fix for the watchdog resets.
    # Those trigger with loopTask not feeding the wdt while CPU 1 sits in IDLE1,
    # i.e. the loop is blocked waiting, not busy computing - see the analysis in
    # the repo notes. Fewer transfers narrows the window but does not close it.
    update_interval: 1s
    # Eight CGRAM slots (positions 0..7) are available. In lambdas they are
    # referenced as escapes \x01..\x07 -- position 0 cannot be written as \x00
    # because that terminates a C string, so it is addressed through its
    # mirror at 0x08 (see mark_back in the lcd_menu above).
    # In use: \x01 degrees, \x02 fan running, \x03 no signal, \x04 signal,
    # \x05 attention, \x06 mqtt connected, \x07 mqtt enabled but not connected.
    # All eight slots are taken - adding another icon means retiring one.
    user_characters:
      - position: 0
        data:  # mark_back symbol, referenced as 0x08
          - 0b00100
          - 0b01000
          - 0b11110
          - 0b01001
          - 0b00101
          - 0b00001
          - 0b11110
          - 0b00000
      - position: 1
        data:
          # degrees symbol
          - 0b00110
          - 0b01001
          - 0b01001
          - 0b00110
          - 0b00000
          - 0b00000
          - 0b00000
          - 0b00000
      - position: 2
        data:
          # Fan running: two-blade rotor around a hub. The asymmetry reads as
          # rotation and keeps it distinct from the round mqtt discs.
          # This slot used to hold a "^3" glyph for g/m3 units, which no page
          # ever drew - the absolute humidity sensors are exported to HA/MQTT
          # but not shown on the LCD. All eight slots are taken now, so getting
          # that glyph back means giving up another one.
          - 0b00000
          - 0b11000
          - 0b11100
          - 0b00100
          - 0b00111
          - 0b00011
          - 0b00000
          - 0b00000
      - position: 3
        data:
          # No Signal Icon
          - 0b00000
          - 0b00000
          - 0b00000
          - 0b00000
          - 0b00000
          - 0b10000
          - 0b10000
          - 0b00000
      - position: 4
        data:
          # Signal Icon
          - 0b00000
          - 0b00001
          - 0b00001
          - 0b00101
          - 0b00101
          - 0b10101
          - 0b10101
          - 0b00000
      - position: 5
        data:
          # Attention Icon
          - 0b00110
          - 0b00110
          - 0b00110
          - 0b00110
          - 0b00110
          - 0b00000
          - 0b00110
          - 0b00110
      - position: 6
        data:
          # MQTT connected: filled disc. Deliberately not a bar/arc shape so it
          # cannot be confused with the wifi signal glyphs next to it.
          - 0b00000
          - 0b00000
          - 0b01110
          - 0b11111
          - 0b11111
          - 0b11111
          - 0b01110
          - 0b00000
      - position: 7
        data:
          # MQTT enabled but not connected: same disc, hollow. Filled vs hollow
          # reads at a glance on a 5x8 cell.
          - 0b00000
          - 0b00000
          - 0b01110
          - 0b10001
          - 0b10001
          - 0b10001
          - 0b01110
          - 0b00000
    # Layout (20x4). Row 0 is a status bar drawn on every page, rows 1..3 are
    # owned by the current page:
    #
    #   col 0    5         13    17 18 19
    #       HH:MM           !     % o  ~   <- time, error, fan, mqtt, wifi
    #                                          (icons cluster on the right)
    #       I<- indoor ->  O<- outdoor ->  <- page 1: cols 0..8 / 11..19
    #
    # Pages reachable by turning the encoder: 0 decision (delta vs. setpoint
    # and the reason), 1 measurements, 2 faults, 3 wifi, 4 reset statistics.
    # Page 0 is where the device sits by default, because it answers the
    # question the device exists for; the raw measurements are one click away.
    # The encoder clamps at 0 and 4 - keep both bounds in the rotary_encoder
    # handlers in step with this list when adding a page.
    # Page 100 is OTA and is only entered by the update handlers.
    #
    # When the menu is open it owns the whole display and nothing else is drawn.
    lambda: |-
      id(lcd_menu_id).draw();
      if (!id(lcd_menu_id).is_active())
      {
        // Clear Display
        it.clear();

        switch (id(page_id))
        {
          // Decision page, and deliberately the one you land on: it answers
          // "is it ventilating, and if not why" without any mental arithmetic.
          // The measurements behind it are one click away on page 1.
          case 0:
            it.printf(0, 1, "Delta   %6.1f\x01" "C", id(delta_dew_point_id).state);
            it.printf(0, 2, "Minimum %6.1f\x01" "C", id(dew_point_difference_min_id).state);
            it.printf(0, 3, "%s", id(fan_reason_text_id).state.c_str());
            break;

          // Measurements: indoor in the left column, outdoor in the right, one
          // quantity per row (temperature, humidity, dew point).
          //
          // Each value carries an "I"/"O" prefix. Without it the page was four
          // unlabelled numbers - the row tells you the quantity, but nothing
          // said which column was which, and there is no spare row for a header
          // because row 0 belongs to the status bar.
          // Budget per block: prefix + %6.1f + two more characters = 9 columns,
          // so 0..8 and 11..19 with a two-column gap. %6.1f is wide enough for
          // every value that can occur here (-30.0 and 100.0 are five).
          // "%6.1f\x01" "C" is split so the compiler does not read \x01C as a
          // single hex escape; \x01 is the degree glyph.
          case 1:
            // Temperatures
            it.printf(0, 1, "I%6.1f\x01" "C", id(indoor_temperature_id).state);
            it.printf(11, 1, "O%6.1f\x01" "C", id(outdoor_temperature_id).state);

            // Humidities
            it.printf(0, 2, "I%6.1f %%", id(indoor_humidity_id).state);
            it.printf(11, 2, "O%6.1f %%", id(outdoor_humidity_id).state);

            // Dewpoints
            it.printf(0, 3, "I%6.1f\x01" "C", id(indoor_dew_point_id).state);
            it.printf(11, 3, "O%6.1f\x01" "C", id(outdoor_dew_point_id).state);
            break;

          // Sensor missing. The outdoor line moves down to row 3 when the
          // indoor line already occupies row 2, so both can be shown at once.
          case 2:
            if(!id(outdoor_sensor_error_id) && !id(indoor_sensor_error_id)) {
              it.print(0, 2, "   System is fine!");
            } else {
              it.printf(0, 1, "Error:");
              if (id(indoor_sensor_error_id) == true) {
                it.print(0, 2, "- Sensor indoor");
              }
              if (id(outdoor_sensor_error_id) == true) {
                if (id(indoor_sensor_error_id) == true) {
                  it.print(0, 3, "- Sensor outdoor");
                } else {
                  it.print(0, 2, "- Sensor outdoor");
                }
              }
            }
            break;

          // WiFi Info
          case 3:
            if (id(wifi_id).is_disabled()) {
              it.print(0, 2, "    WiFi disabled");
            } else {
              if (id(wifi_id).is_connected()) {
                it.printf(0, 1, "IP: %16s", id(ip_address_id).state.c_str());
                it.printf(0, 2, "Signal: %11.1f%%", id(wifi_signal_percent).state);
              } else {
                it.print(0, 2, "   WiFi connecting");
              }
            }
            break;

          // Reset statistics. Count and cause belong together: the count says
          // how often the device restarted, the reason says what did it, and a
          // high count at a short uptime is the watchdog signature.
          // The reason gets a row of its own because the strings in
          // debug_esp32.cpp run up to 24 characters ("software via esp_restart")
          // and the field is bounded to the 20 the display has.
          case 4:
            it.printf(0, 1, "Resets: %11u", (unsigned) id(reset_count_id));
            it.print(0, 2, "Last cause:");
            it.printf(0, 3, "%-20.20s", id(reset_reason_id).state.c_str());
            break;

          // OTA. Reached only via the OTA handlers, never by turning the
          // encoder; turning leaves it again because 100 is outside 0..3.
          case 100:
            // force the light on regardless of the backlight timer, an update
            // can take longer than backlight_delay
            it.backlight();

            // Show OTA Update
            switch (id(ota_state_id)) {
              case ota::OTA_STARTED:
                it.printf(0, 3, "OTA starting...");
                break;
              case ota::OTA_IN_PROGRESS:
                it.printf(0, 3, "OTA progress:%6.1f%%", id(ota_progress_id));
                break;
              case ota::OTA_COMPLETED:
                it.printf(0, 3, "OTA completed...");
                break;
              case ota::OTA_ERROR:
                it.printf(0, 3, "OTA error: %d", id(ota_error_id));
                break;
            }
            break;
        }

        // ---- status bar on row 0, drawn on top of every page ----

        // Show Time; --:-- while the RTC has not delivered a valid time yet
        if (id(ds1307_time).now().is_valid()) {
          it.strftime(0, 0, "%H:%M", id(ds1307_time).now());
        } else {
          it.print(0, 0, "--:--");
        }

        // show error icon (attention glyph) on a failed OTA or a dead sensor;
        // empty string when everything is fine, which leaves the cell blank
        it.printf(13, 0, "%s", (id(ota_state_id) == ota::OTA_ERROR || id(indoor_sensor_error_id) || id(outdoor_sensor_error_id)) ? "\x05" : "");

        // Fan: rotor glyph while running, blank while stopped. Same idiom as
        // the error icon above - an empty string leaves the cell as cleared.
        // Stopped is the normal state, so blank is the quiet default and the
        // eye is drawn only when the fan actually runs.
        it.printf(17, 0, "%s", id(relais_id).state ? "\x02" : "");

        // MQTT state, three-valued unlike wifi: blank while the client is
        // disabled (the default - see enable_on_boot), hollow disc once the
        // user switched it on from the menu, filled disc when the broker
        // actually answers. The distinction matters here because this broker
        // drops the connection regularly.
        if (!id(mqtt_state_id).state) {
          it.print(18, 0, " ");
        } else {
          it.print(18, 0, id(mqtt_client_id).is_connected() ? "\x06" : "\x07");
        }

        // WiFi Connection State: signal / no-signal glyph in the last cell
        it.printf(19, 0, "%s", id(wifi_id).is_connected() ? "\x04" : "\x03");
      }
